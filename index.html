<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Contratos — D'Luh Festas</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --muted:#6b7280;
    --line:#e3e6ea; --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --danger:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .tabs{display:flex;gap:8px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:var(--card);padding:9px 14px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{background:var(--brand-d)}
  button.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .err{color:var(--danger);font-size:12px;margin-top:3px;display:none}
  .field.invalid input,.field.invalid textarea{border-color:var(--danger)}
  .field.invalid .err{display:block}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  .clause{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
  .clause h4{margin:0 0 6px;font-size:14px}
  .clause textarea{min-height:90px;font-size:13px}
  /* Preview / PDF */
  #preview{background:#fff;padding:40px 44px;max-width:800px;margin:0 auto;
    font-family:Georgia,"Times New Roman",serif;color:#111;font-size:12px;line-height:1.34}
  #preview .logo{margin:0 -44px 12px;overflow:hidden}
  #preview .logo img{display:block;width:100%;max-width:none;height:auto}
  #preview h2{text-align:center;font-size:15px;margin:0 0 14px;text-transform:uppercase}
  #preview .cl{margin:0 0 8px}
  #preview .cl h3{font-size:12px;margin:0 0 2px}
  #preview .cl p{margin:0;white-space:pre-wrap;text-align:justify}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;
    transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:var(--brand)}
  /* Login */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  #gate .card{max-width:340px;width:90%}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    #preview{padding:24px}
    #preview .logo{margin:0 -24px 14px}
    .wrap{padding:12px}
  }
  @media print{header,.noprint{display:none!important}}
</style>
</head>
<body>

<!-- ===== SENHA ===== -->
<div id="gate">
  <div class="card">
    <h1>🔒 Acesso</h1>
    <p class="muted">Digite a senha para continuar.</p>
    <input id="gatePass" type="password" placeholder="Senha" autocomplete="current-password">
    <p class="err" id="gateErr" style="display:none">Senha incorreta.</p>
    <button class="primary" style="width:100%;margin-top:12px" onclick="tryLogin()">Entrar</button>
  </div>
</div>

<header class="hidden" id="topbar">
  <div class="wrap">
    <div class="row">
      <h1>📄 Gerador de Contratos</h1>
      <span class="badge" id="storeBadge">—</span>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabEditor" onclick="showView('editor')">Editar</button>
      <button class="tab" id="tabHist" onclick="showView('hist');loadHistory()">Histórico</button>
    </div>
  </div>
</header>

<main class="wrap hidden" id="main">

  <!-- ===== EDITOR ===== -->
  <section id="view-editor">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <label style="margin:0">Nome deste contrato (para o histórico)</label>
          <input id="contractName" placeholder="Em branco = Nome Sobrenome - Tipo de evento">
        </div>
        <div class="row noprint">
          <button onclick="novo()">Novo</button>
          <button class="primary" onclick="salvar()">Salvar</button>
          <button class="primary" onclick="gerarPDF()">Gerar PDF</button>
        </div>
      </div>
      <input type="hidden" id="editingId">
    </div>

    <div class="card">
      <h3 style="margin-top:0">Dados do contrato</h3>
      <div class="grid" id="fields"></div>
    </div>

    <div class="card noprint">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">Texto do contrato (cláusulas)</h3>
        <button onclick="toggleClauses()" id="btnClauses">Editar texto</button>
      </div>
      <p class="muted">Você pode alterar qualquer cláusula. Use <code>{{id_do_campo}}</code> para inserir dados automaticamente.</p>
      <div id="clauses" class="hidden"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0" class="noprint">Pré-visualização</h3>
      <div id="preview"></div>
    </div>
  </section>

  <!-- ===== HISTÓRICO ===== -->
  <section id="view-hist" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">Contratos salvos</h3>
      <p class="muted" id="histInfo">Carregando…</p>
      <table>
        <thead><tr><th>Nome</th><th>Criado</th><th class="noprint"></th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<!-- Bibliotecas (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="model.js"></script>
<script src="logo.js"></script>
<script>
// ============================================================
//  ESTADO
// ============================================================
const CFG = window.APP_CONFIG || {};
const MODEL = window.MODELO_PADRAO;
let sb = null;                 // cliente supabase
let clausesState = [];         // cláusulas (texto editável) deste contrato
let useSupabase = false;
let extensoDirty = false;       // usuário editou o "valor por extenso" manualmente?

// ---- init supabase (se configurado) ----
if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) {
  try {
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    useSupabase = true;
  } catch(e){ console.warn("Supabase falhou, usando localStorage.", e); }
}

// ============================================================
//  LOGIN (senha simples)
// ============================================================
function tryLogin(){
  const v = document.getElementById('gatePass').value;
  if (v === (CFG.SENHA || "")) {
    sessionStorage.setItem('auth','1');
    openApp();
  } else {
    document.getElementById('gateErr').style.display='block';
  }
}
function openApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('storeBadge').textContent = useSupabase ? 'Supabase' : 'Local (navegador)';
  buildForm();
  novo();
}
document.getElementById('gatePass').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
if (sessionStorage.getItem('auth')==='1') openApp();

// ============================================================
//  FORMULÁRIO
// ============================================================
function buildForm(){
  const c = document.getElementById('fields');
  c.innerHTML = '';
  MODEL.campos.forEach(f=>{
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.id = 'field-'+f.id;
    const ph = f.tipo==='money' ? 'Ex: 2.500,00' : f.tipo==='doc' ? 'CPF ou CNPJ' : '';
    const input = f.tipo==='textarea'
      ? `<textarea id="in-${f.id}" data-id="${f.id}" placeholder="${ph}"></textarea>`
      : `<input id="in-${f.id}" data-id="${f.id}" type="${f.tipo==='date'?'date':'text'}"
           placeholder="${ph}" ${f.tipo==='money'?'inputmode="decimal"':''}>`;
    wrap.innerHTML = `<label>${f.label}${f.obrigatorio?' *':''}</label>${input}
      <div class="err" id="err-${f.id}"></div>`;
    c.appendChild(wrap);
  });
  // formatação e atualização ao digitar
  MODEL.campos.forEach(f=>{
    const el = document.getElementById('in-'+f.id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      clearErr(f.id);
      if(f.tipo==='doc') el.value = maskDoc(el.value);
      if(f.id==='valor_extenso') extensoDirty = true;
      if(f.id==='valor_total' && !extensoDirty){
        const ex = document.getElementById('in-valor_extenso');
        if(ex) ex.value = extensoReais(el.value);
      }
      renderPreview();
    });
    el.addEventListener('blur', ()=>{
      if(f.tipo==='money'){ const n=parseMoney(el.value); if(!isNaN(n)) el.value=fmtMoney(el.value); }
      if(f.tipo==='hora'){ el.value = fmtHora(el.value); }
      renderPreview();
    });
  });
}

function getValues(){
  const v = {};
  MODEL.campos.forEach(f=> v[f.id] = (document.getElementById('in-'+f.id)?.value||'').trim());
  return v;
}
function setValues(v){
  MODEL.campos.forEach(f=>{
    const el = document.getElementById('in-'+f.id);
    if (el) el.value = v[f.id]||'';
  });
}

// ============================================================
//  CLÁUSULAS (texto editável)
// ============================================================
function loadClauses(clauses){
  clausesState = (clauses && clauses.length)
    ? JSON.parse(JSON.stringify(clauses))
    : JSON.parse(JSON.stringify(MODEL.clausulas));
  renderClausesEditor();
}
function renderClausesEditor(){
  const c = document.getElementById('clauses');
  c.innerHTML = '';
  clausesState.forEach((cl,i)=>{
    const d = document.createElement('div');
    d.className='clause';
    d.innerHTML = `<h4>${cl.titulo}</h4>
      <textarea data-i="${i}">${escapeHtml(cl.texto)}</textarea>`;
    c.appendChild(d);
  });
  c.querySelectorAll('textarea').forEach(t=>{
    t.addEventListener('input', ()=>{ clausesState[t.dataset.i].texto = t.value; renderPreview(); });
  });
}
function toggleClauses(){
  const el = document.getElementById('clauses');
  const hidden = el.classList.toggle('hidden');
  document.getElementById('btnClauses').textContent = hidden ? 'Editar texto' : 'Ocultar texto';
}

// ============================================================
//  PREVIEW  (substitui {{campos}})
// ============================================================
function fill(text, vals){
  return text.replace(/\{\{\s*([\w]+)\s*\}\}/g, (_,k)=>{
    const f = MODEL.campos.find(x=>x.id===k);
    let val = vals[k];
    if (val==null || val==='') return '__________';
    if (f && f.tipo==='money') val = fmtMoney(val);
    if (f && f.tipo==='date')  val = fmtDate(val);
    return val;
  });
}
function renderPreview(){
  const vals = getValues();
  const p = document.getElementById('preview');
  let html = '';
  if (window.LOGO_CONTRATO) html += `<div class="logo"><img src="${window.LOGO_CONTRATO}" alt="logo"></div>`;
  html += `<h2>${escapeHtml(MODEL.titulo)}</h2>`;
  clausesState.forEach(cl=>{
    html += `<div class="cl"><h3>${escapeHtml(cl.titulo)}</h3>
      <p>${escapeHtml(fill(cl.texto, vals))}</p></div>`;
  });
  p.innerHTML = html;
}

// ============================================================
//  VALIDAÇÃO
// ============================================================
function validate(){
  let ok = true; let first=null;
  const vals = getValues();
  MODEL.campos.forEach(f=>{
    const val = vals[f.id];
    let msg = '';
    if (f.obrigatorio && !val) msg = 'Campo obrigatório.';
    else if (val && f.tipo==='doc' && !validaDoc(val)) msg = 'CPF/CNPJ inválido.';
    else if (val && f.tipo==='money' && isNaN(parseMoney(val))) msg = 'Valor inválido.';
    if (msg){ ok=false; showErr(f.id,msg); if(!first) first=f.id; }
    else clearErr(f.id);
  });
  if (first) document.getElementById('in-'+first).focus();
  return ok;
}
function showErr(id,msg){
  document.getElementById('field-'+id)?.classList.add('invalid');
  const e=document.getElementById('err-'+id); if(e) e.textContent=msg;
}
function clearErr(id){ document.getElementById('field-'+id)?.classList.remove('invalid'); }

// ---- CPF/CNPJ ----
function validaDoc(v){
  const n = v.replace(/\D/g,'');
  return n.length===11 ? validaCPF(n) : n.length===14 ? validaCNPJ(n) : false;
}
function validaCPF(c){
  if(/^(\d)\1{10}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=+c[i]*(10-i);
  let d=(s*10)%11; if(d===10)d=0; if(d!==+c[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=+c[i]*(11-i);
  d=(s*10)%11; if(d===10)d=0; return d===+c[10];
}
function validaCNPJ(c){
  if(/^(\d)\1{13}$/.test(c)) return false;
  const calc=(len)=>{let s=0,p=len-7;for(let i=len;i>=1;i--){s+=+c[len-i]*p--;if(p<2)p=9;}let r=s%11;return r<2?0:11-r;};
  return calc(12)===+c[12] && calc(13)===+c[13];
}

// ---- formatação ----
function parseMoney(v){
  let s = String(v).replace(/[^\d.,]/g,'');
  if(s==='') return NaN;
  if(s.includes(',')){                    // pt-BR: vírgula decimal, ponto milhar
    s = s.replace(/\./g,'').replace(',','.');
  } else if(s.includes('.')){             // só ponto: decidir milhar x decimal
    const parts = s.split('.');
    const last = parts[parts.length-1];
    if(parts.length>2 || last.length===3) s = parts.join(''); // milhar (1.234 / 1.234.567)
    // senão trata ponto como decimal (1234.5 / 1234.56)
  }
  return parseFloat(s);
}
function fmtMoney(v){ const n=parseMoney(v); return isNaN(n)?v:n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(v){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const[a,m,d]=v.split('-'); return `${d}/${m}/${a}`; }
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- máscara CPF/CNPJ ----
function maskDoc(v){
  const d = v.replace(/\D/g,'').slice(0,14);
  if(d.length<=11){ // CPF
    if(d.length>9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
    if(d.length>6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
    if(d.length>3) return `${d.slice(0,3)}.${d.slice(3)}`;
    return d;
  } // CNPJ
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`.replace(/[-/.]+$/,'');
}
// ---- hora (normaliza "2100" -> "21:00"; preserva AM/PM) ----
function fmtHora(v){
  const t = String(v).trim();
  if(!t) return t;
  const ampm = /(am|pm)/i.exec(t);
  const d = t.replace(/\D/g,'');
  let core = t;
  if(/^\d{3,4}$/.test(d)){
    const hh = d.slice(0, d.length-2), mm = d.slice(-2);
    core = hh.padStart(2,'0')+':'+mm;
  } else if(/^\d{1,2}$/.test(d)){
    core = d.padStart(2,'0')+':00';
  }
  return ampm ? core+' '+ampm[1].toUpperCase() : core;
}
// ---- número por extenso (pt-BR) ----
function extensoReais(v){
  let n = parseMoney(v);
  if(isNaN(n)) return '';
  n = Math.round(n*100);
  const reais = Math.floor(n/100), cent = n%100;
  let out = '';
  if(reais>0) out = numeroExtenso(reais) + (reais===1?' real':' reais');
  if(cent>0) out += (out?' e ':'') + numeroExtenso(cent) + (cent===1?' centavo':' centavos');
  return out || 'zero reais';
}
const _U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const _D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const _C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ate999(n){
  if(n===0) return '';
  if(n===100) return 'cem';
  let s=''; const c=Math.floor(n/100), r=n%100;
  if(c>0) s=_C[c];
  if(r>0){ if(s) s+=' e ';
    if(r<20) s+=_U[r];
    else { const d=Math.floor(r/10), u=r%10; s+=_D[d]; if(u>0) s+=' e '+_U[u]; }
  }
  return s;
}
function numeroExtenso(n){
  if(n===0) return 'zero';
  const bil=Math.floor(n/1e9), mi=Math.floor(n/1e6)%1000, mil=Math.floor(n/1000)%1000, resto=n%1000;
  const parts=[];
  if(bil>0)  parts.push(ate999(bil)+(bil===1?' bilhão':' bilhões'));
  if(mi>0)   parts.push(ate999(mi)+(mi===1?' milhão':' milhões'));
  if(mil>0)  parts.push(mil===1?'mil':ate999(mil)+' mil');
  if(resto>0)parts.push(ate999(resto));
  let out='';
  for(let i=0;i<parts.length;i++){
    if(i>0) out += (i===parts.length-1 && (resto<100 || resto%100===0)) ? ' e ' : ', ';
    out += parts[i];
  }
  return out;
}
// ---- nome padrão do contrato ----
function defaultName(){
  const v = getValues();
  const nome = (v.contratante_nome||'').trim().split(/\s+/).slice(0,2).join(' ');
  const evento = (v.evento_tipo||'').trim();
  if(nome && evento) return `${nome} - ${evento}`;
  if(nome) return nome;
  return MODEL.titulo;
}

// ============================================================
//  PDF
// ============================================================
function gerarPDF(){
  if(!validate()){ toast('Corrija os campos destacados.'); return; }
  renderPreview();
  const nome = (document.getElementById('contractName').value.trim() || defaultName())
    .replace(/[^\w\s-]/g,'').replace(/\s+/g,'_');
  const el = document.getElementById('preview').cloneNode(true);
  html2pdf().set({
    margin:[10,11,10,11],
    filename: nome+'.pdf',
    image:{type:'jpeg',quality:.98},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  }).from(el).save().then(()=>toast('PDF gerado.'));
}

// ============================================================
//  SALVAR / HISTÓRICO
// ============================================================
function currentRecord(){
  return {
    nome: document.getElementById('contractName').value.trim() || defaultName(),
    modelo_titulo: MODEL.titulo,
    campos: getValues(),
    clausulas: clausesState,
  };
}
async function salvar(){
  if(!validate()){ toast('Corrija os campos destacados.'); return; }
  const rec = currentRecord();
  const id = document.getElementById('editingId').value;
  try{
    if(useSupabase){
      if(id){
        const {error} = await sb.from('contratos').update(rec).eq('id',id);
        if(error) throw error;
      } else {
        const {data,error} = await sb.from('contratos').insert(rec).select('id').single();
        if(error) throw error;
        document.getElementById('editingId').value = data.id;
      }
    } else {
      const list = lsGet();
      if(id){
        const i=list.findIndex(x=>x.id===id); if(i>=0) list[i]={...list[i],...rec};
      } else {
        rec.id = 'loc-'+Date.now(); rec.created_at=new Date().toISOString();
        document.getElementById('editingId').value = rec.id; list.unshift(rec);
      }
      lsSet(list);
    }
    toast('Contrato salvo.');
  }catch(e){ console.error(e); toast('Erro ao salvar: '+(e.message||e)); }
}

async function loadHistory(){
  const info=document.getElementById('histInfo'); const body=document.getElementById('histBody');
  body.innerHTML=''; info.textContent='Carregando…';
  let list=[];
  try{
    if(useSupabase){
      const {data,error}=await sb.from('contratos').select('*').order('created_at',{ascending:false});
      if(error) throw error; list=data||[];
    } else list=lsGet();
  }catch(e){ info.textContent='Erro ao carregar: '+(e.message||e); return; }
  info.textContent = list.length? `${list.length} contrato(s).` : 'Nenhum contrato salvo ainda.';
  list.forEach(r=>{
    const tr=document.createElement('tr');
    const dt = r.created_at? new Date(r.created_at).toLocaleString('pt-BR') : '—';
    tr.innerHTML=`<td>${escapeHtml(r.nome||'—')}</td><td class="muted">${dt}</td>
      <td class="noprint"><div class="row">
        <button onclick='abrir(${JSON.stringify(r.id)})'>Editar</button>
        <button onclick='excluir(${JSON.stringify(r.id)})'>Excluir</button>
      </div></td>`;
    body.appendChild(tr);
  });
}
async function abrir(id){
  let r=null;
  try{
    if(useSupabase){ const {data,error}=await sb.from('contratos').select('*').eq('id',id).single(); if(error)throw error; r=data; }
    else r=lsGet().find(x=>x.id===id);
  }catch(e){ toast('Erro: '+(e.message||e)); return; }
  if(!r){ toast('Não encontrado.'); return; }
  document.getElementById('editingId').value = r.id;
  document.getElementById('contractName').value = r.nome||'';
  setValues(r.campos||{});
  extensoDirty = true;
  loadClauses(r.clausulas);
  renderPreview();
  showView('editor');
  toast('Aberto para edição.');
}
async function excluir(id){
  if(!confirm('Excluir este contrato?')) return;
  try{
    if(useSupabase){ const {error}=await sb.from('contratos').delete().eq('id',id); if(error)throw error; }
    else lsSet(lsGet().filter(x=>x.id!==id));
    loadHistory(); toast('Excluído.');
  }catch(e){ toast('Erro: '+(e.message||e)); }
}

// ---- localStorage fallback ----
function lsGet(){ try{return JSON.parse(localStorage.getItem('contratos')||'[]');}catch(e){return[];} }
function lsSet(l){ localStorage.setItem('contratos',JSON.stringify(l)); }

// ============================================================
//  NAV / UTIL
// ============================================================
function novo(){
  document.getElementById('editingId').value='';
  document.getElementById('contractName').value='';
  extensoDirty = false;
  setValues({});
  loadClauses(null);
  renderPreview();
}
function showView(v){
  document.getElementById('view-editor').classList.toggle('hidden', v!=='editor');
  document.getElementById('view-hist').classList.toggle('hidden', v!=='hist');
  document.getElementById('tabEditor').classList.toggle('active', v==='editor');
  document.getElementById('tabHist').classList.toggle('active', v==='hist');
}
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
</script>
